<head>
<meta charset="UTF-8">

<style>
  :root {
    --black: #000000;
    --card: #0a0f0b;
    --card-hover: #0e1a11;
    --line: #17301f;
    --green: #2bea7b;
    --green-deep: #0f9d58;
    --text: #f2fff6;
    --muted: #8aa593;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }

  body {
    min-height: 100%;
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(43, 234, 123, 0.22), transparent 70%),
      radial-gradient(50% 35% at 100% 100%, rgba(15, 157, 88, 0.20), transparent 70%),
      var(--black);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 48px 20px 40px;
  }

  main { width: 100%; max-width: 440px; }

  /* ---------- Profile ---------- */
  .profile { text-align: center; margin-bottom: 32px; }

  .avatar {
    width: 112px; height: 112px;
    margin: 0 auto 18px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 0deg, var(--green), #b6ff5c, var(--green-deep), var(--green));
    box-shadow: 0 0 40px rgba(43, 234, 123, 0.45);
    animation: spin-glow 6s linear infinite;
  }
  .avatar-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--black);
    display: grid; place-items: center;
    overflow: hidden;
    font-size: 40px; font-weight: 700; color: var(--green);
  }
  .avatar-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }

  @keyframes spin-glow {
    to { filter: hue-rotate(25deg); box-shadow: 0 0 56px rgba(43, 234, 123, 0.65); }
  }

  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .handle { margin-top: 4px; font-size: 14px; color: var(--green); font-weight: 600; }
  .bio { margin: 12px auto 0; max-width: 32ch; font-size: 14px; line-height: 1.6; color: var(--muted); }

  /* ---------- Links ---------- */
  .links { list-style: none; display: grid; gap: 14px; }

  .link {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 18px 12px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    color: inherit; text-decoration: none;
    transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .link:hover {
    transform: translateY(-2px);
    background: var(--card-hover);
    border-color: var(--green);
    box-shadow: 0 8px 28px rgba(43, 234, 123, 0.18);
  }
  .link:active { transform: translateY(0); }
  .link:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

  .icon {
    flex: none;
    width: 52px; height: 52px;
    border-radius: 14px;
    display: grid; place-items: center;
    color: #fff;
  }
  .icon svg { width: 26px; height: 26px; }

  .text { flex: 1; min-width: 0; }
  .label { font-size: 16px; font-weight: 600; }
  .sub { margin-top: 2px; font-size: 12.5px; color: var(--muted); }

  .chev { flex: none; width: 18px; height: 18px; color: var(--muted); transition: color .18s, transform .18s; }
  .link:hover .chev { color: var(--green); transform: translateX(3px); }

  /* Brand-coloured icon tiles */
  .website   { background: linear-gradient(135deg, #2bea7b, #0f9d58); color: #001a0b; }
  .telegram  { background: linear-gradient(135deg, #37aee2, #1e96c8); }
  .whatsapp  { background: linear-gradient(135deg, #25d366, #128c7e); }
  .github    { background: linear-gradient(135deg, #3a3f47, #16191d); border: 1px solid #2c3138; }
  .instagram { background: linear-gradient(45deg, #feda75 0%, #fa7e1e 25%, #d62976 50%, #962fbf 75%, #4f5bd5 100%); }

  footer { margin-top: 34px; text-align: center; font-size: 12px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .avatar { animation: none; }
    .link, .chev { transition: none; }
    .link:hover { transform: none; }
  }
</style>
