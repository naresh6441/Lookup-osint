<script>

const API_URL = "/api/vehicle";
const PARAMETER = "number";

const DATA_PASSWORD = "987654";

const consoleBox =
    document.getElementById("console");

const statusBox =
    document.getElementById("status");


function log(message, type = "info") {

    const time = new Date().toLocaleTimeString();

    const div = document.createElement("div");

    div.className = type;

    div.textContent =
        "[" + time + "] " + message;

    consoleBox.appendChild(div);

    consoleBox.scrollTop =
        consoleBox.scrollHeight;
}


function getSavedData() {

    try {

        return JSON.parse(
            localStorage.getItem("vehicleSavedData")
        ) || [];

    } catch {

        return [];

    }
}


function saveVehicleData(vehicle, data) {

    const records = getSavedData();

    records.unshift({

        id: Date.now(),

        vehicleNumber: vehicle,

        searchedAt:
            new Date().toLocaleString(),

        response: data

    });

    localStorage.setItem(
        "vehicleSavedData",
        JSON.stringify(records)
    );

    log(
        "💾 Vehicle data automatically saved",
        "success"
    );
}


async function lookupVehicle() {

    const input =
        document.getElementById("vehicleNumber");

    const vehicle =
        input.value
        .trim()
        .toUpperCase();


    if (!vehicle) {

        statusBox.textContent =
            "❌ Enter vehicle number";

        log(
            "Vehicle number is empty",
            "error"
        );

        return;
    }


    statusBox.textContent =
        "⏳ Searching...";


    log(
        "--------------------------------",
        "info"
    );

    log(
        "SEARCH: " + vehicle,
        "info"
    );


    try {

        const url =
            API_URL +
            "?" +
            PARAMETER +
            "=" +
            encodeURIComponent(vehicle);


        log(
            "Calling Vercel API...",
            "info"
        );


        const start =
            performance.now();


        const response =
            await fetch(url, {
                method: "GET",
                headers: {
                    "Accept":
                        "application/json"
                }
            });


        const elapsed =
            Math.round(
                performance.now() - start
            );


        log(
            "HTTP " +
            response.status +
            " (" +
            elapsed +
            " ms)",
            response.ok
                ? "success"
                : "error"
        );


        const raw =
            await response.text();


        let data;

        try {

            data = JSON.parse(raw);

        } catch {

            data = {
                response: raw
            };

        }


        if (!response.ok) {

            log(
                "API ERROR:",
                "error"
            );

            log(
                JSON.stringify(
                    data,
                    null,
                    2
                ),
                "error"
            );

            statusBox.textContent =
                "❌ API request failed";

            return;
        }


        log(
            "✅ Vehicle data received",
            "success"
        );


        log(
            JSON.stringify(
                data,
                null,
                2
            ),
            "success"
        );


        saveVehicleData(
            vehicle,
            data
        );


        statusBox.textContent =
            "✅ Search successful & saved";


    } catch (error) {

        statusBox.textContent =
            "❌ Connection failed";

        log(
            "ERROR: " +
            error.message,
            "error"
        );

    }
}


function openData() {

    document
        .getElementById("passwordModal")
        .style.display = "flex";

    document
        .getElementById("dataPassword")
        .value = "";

}


function closeModal() {

    document
        .getElementById("passwordModal")
        .style.display = "none";

}


function checkPassword() {

    const password =
        document
        .getElementById("dataPassword")
        .value;


    if (password === DATA_PASSWORD) {

        closeModal();

        showData();

        document
            .getElementById("dataModal")
            .style.display = "flex";

    } else {

        alert("❌ Incorrect password");

    }

}


function showData() {

    const records =
        getSavedData();

    const box =
        document.getElementById("records");


    if (!records.length) {

        box.innerHTML =
            "<p style='text-align:center;color:#aaa'>" +
            "No saved vehicle data." +
            "</p>";

        return;
    }


    box.innerHTML = "";


    records.forEach(record => {

        const card =
            document.createElement("div");

        card.className = "card";


        const title =
            document.createElement("div");

        title.innerHTML =
            "<b>🚘 " +
            escapeHTML(
                record.vehicleNumber
            ) +
            "</b><br>" +

            "<small>" +
            escapeHTML(
                record.searchedAt
            ) +
            "</small>";


        const pre =
            document.createElement("pre");

        pre.textContent =
            JSON.stringify(
                record.response,
                null,
                2
            );


        const del =
            document.createElement("button");

        del.textContent =
            "🗑️ Delete";

        del.onclick =
            () => deleteRecord(record.id);


        card.appendChild(title);

        card.appendChild(pre);

        card.appendChild(del);

        box.appendChild(card);

    });

}


function deleteRecord(id) {

    const records =
        getSavedData()
        .filter(
            item => item.id !== id
        );


    localStorage.setItem(
        "vehicleSavedData",
        JSON.stringify(records)
    );


    showData();

}


function deleteAllData() {

    if (!confirm(
        "Delete ALL saved vehicle data?"
    )) {
        return;
    }


    localStorage.removeItem(
        "vehicleSavedData"
    );


    showData();

    log(
        "🗑️ All saved data deleted",
        "warning"
    );

}


function closeData() {

    document
        .getElementById("dataModal")
        .style.display = "none";

}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


document
    .getElementById("vehicleNumber")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {
                lookupVehicle();
            }

        }
    );


log(
    "🚘 Vehicle Lookup initialized",
    "success"
);

log(
    "Vercel API connection ready",
    "info"
);

    </script>
